# PopHeat IRIS Community Edition stack (D-03, D-04, D-05).
#
# Single `iris` service, official intersystemsdc/iris-community image, no
# custom Dockerfile build. The repo root is bind-mounted into the container so
# iris/merge.cpf, docker/init-production.sh, settings.py, and
# popheat_pipeline/ are all visible at /irisdev/app without a rebuild step.
#
# `restart: unless-stopped` plus no volume override on the container's own
# filesystem means an ordinary `docker compose restart` (or host reboot)
# brings the same container back with its data intact and
# PopHeat.Production auto-starting (D-05) -- no manual "start production"
# step, ever, after the one-time docker/init-production.sh run.
services:
  iris:
    image: intersystemsdc/iris-community:latest
    container_name: popheat-iris
    restart: unless-stopped
    command: ["--check-caps", "false"]
    ports:
      - "1972:1972"
      - "52773:52773"
    environment:
      - ISC_CPF_MERGE_FILE=/irisdev/app/iris/merge.cpf
    volumes:
      - ./:/irisdev/app
